seed: 13
device: cuda
cpu_threads: 2

paths:
  raw: data/raw
  models: data/models
  cache: data/cache
  reports: reports
  runs: runs
  mlruns: mlruns

data:
  disk_headroom_gb: 2.0
  eval_split: test
  beir:
    scifact:
      corpus:
        repo: BeIR/scifact
        revision: b3b5335604bf5ee3c4447671af975ea25143d4f5
        files: [corpus/*.parquet, queries/*.parquet]
      qrels:
        repo: BeIR/scifact-qrels
        revision: 2938d17dc3b09882fdb8c12bbbe2e2dc0e75a029
        files: ["*.tsv"]
      # beir ships no dev split for scifact
      tune_split: train
    nfcorpus:
      corpus:
        repo: BeIR/nfcorpus
        revision: b5026a0e96e8a7ac4f95f482a596389289d46269
        files: [corpus/*.parquet, queries/*.parquet]
      qrels:
        repo: BeIR/nfcorpus-qrels
        revision: a451b3b26d3ae1358f259c1a3a4dd61fcea35a65
        files: ["*.tsv"]
      tune_split: dev
    fiqa:
      corpus:
        repo: BeIR/fiqa
        revision: 979c07a7cb5ccc6ca009792241fa1250b98055dd
        files: [corpus/*.parquet, queries/*.parquet]
      qrels:
        repo: BeIR/fiqa-qrels
        revision: 252958f2d646e22cab6d0c72dd3f0d5de6d0655a
        files: ["*.tsv"]
      tune_split: dev
  squad:
    repo: rajpurkar/squad_v2
    revision: 3ffb306f725f7d2ce8394bc1873b24868140c412
    files: [squad_v2/*.parquet]

chunking:
  # chunk lengths are counted in the wordpiece vocabulary shared by the bert-family encoders
  tokenizer:
    repo: google-bert/bert-base-uncased
    revision: 86b5e0934494bd15c9632b12f734a8a67f723594
    files: [tokenizer.json]
  batch_size: 2048
  # chosen a priori; the ablation below decides on scifact's tuning split, never on test
  default:
    strategy: fixed
    chunk_size: 256
    overlap: 64
    prepend_title: true
  ablation:
    strategies: [fixed, sentence]
    chunk_sizes: [128, 256, 512]
    overlap_fractions: [0.0, 0.25]
    include_unchunked: true
    # chosen on this corpus's tuning split; the other corpora are untouched transfer
    tune_corpus: scifact
    # no reranker beats dense retrieval alone on the tuning splits (reports/selection.csv)
    rerank: false

bm25:
  # anserini's defaults, which the published pyserini beir baselines use; not tuned here
  k1: 0.9
  b: 0.4
  stemmer: porter

retrieval:
  # enough chunks that every query's top documents are exact after max-pooling
  candidate_chunks: 1000
  query_batch_size: 64
  latency_warmup: 10

dense:
  model:
    repo: BAAI/bge-base-en-v1.5
    revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
    files:
      - config.json
      - config_sentence_transformers.json
      - modules.json
      - sentence_bert_config.json
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer_config.json
      - vocab.txt
      - model.safetensors
      - 1_Pooling/config.json
  # the instruction bge was trained with for short queries against passages
  query_prefix: "Represent this sentence for searching relevant passages: "
  max_length: 512
  batch_size: 128
  fp16: true

hybrid:
  # the constant from the original reciprocal rank fusion paper, not tuned
  rrf_k: 60

rerank:
  # fixed before any reranking result was seen: a small, a base and a large cross-encoder
  candidates:
    minilm-l6:
      repo: cross-encoder/ms-marco-MiniLM-L6-v2
      revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
      files:
        - config.json
        - model.safetensors
        - special_tokens_map.json
        - tokenizer.json
        - tokenizer_config.json
        - vocab.txt
    bge-base:
      repo: BAAI/bge-reranker-base
      revision: 2cfc18c9415c912f9d8155881c133215df768a70
      files:
        - config.json
        - model.safetensors
        - sentencepiece.bpe.model
        - special_tokens_map.json
        - tokenizer.json
        - tokenizer_config.json
    bge-v2-m3:
      repo: BAAI/bge-reranker-v2-m3
      revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
      files:
        - config.json
        - model.safetensors
        - sentencepiece.bpe.model
        - special_tokens_map.json
        - tokenizer.json
        - tokenizer_config.json
  # best reranker by mean tuning-split nDCG@10 (reports/selection.csv), though none beats dense alone
  model: bge-v2-m3
  # chosen on the tuning splits by scripts/select_models.py, see reports/selection.csv
  first_stage: dense
  # documents handed to the cross-encoder; all their chunks are scored
  top_k: 100
  max_length: 512
  batch_size: 64
  fp16: true
  # cross-encoding a hundred documents takes about a second, so latency uses a fixed sample
  latency_queries: 100

reader:
  model:
    repo: deepset/roberta-base-squad2
    revision: adc3b06f79f797d1c575d5479d6f5efe54a9e3b4
    files:
      - config.json
      - merges.txt
      - model.safetensors
      - special_tokens_map.json
      - tokenizer_config.json
      - vocab.json
  # the window and stride the model was fine-tuned with
  max_length: 384
  stride: 128
  max_answer_tokens: 30
  batch_size: 64
  fp16: true

e2e:
  # train paragraphs are distractors: no article or paragraph is shared with the dev set
  corpus_splits: [train, validation]
  eval_split: validation
  # dev articles held out for the abstention threshold; the rest is evaluation
  tune_articles: 10
  top_k: 5
  # paragraphs the cross-encoder re-scores; fixed a priori to keep reranking near 100 ms per question
  rerank_depth: 20
  threshold_points: 101
  latency_questions: 500

serve:
  # the e2e row with the best tuning-article score; its threshold comes from reports/e2e_results.csv
  pipeline: bm25
  # the reranked variant is timed too, so its cost is on record although it is not served
  benchmark_pipelines: [bm25, bm25+rerank]
  warmup_queries: 20
  benchmark_queries: 300

index_study:
  corpus: fiqa
  hnsw_m: 32
  hnsw_ef_construction: 200
  hnsw_ef_search: [16, 32, 64, 128, 256, 512]
  ivf_lists: 1024
  pq_subquantizers: 96
  pq_bits: 8
  ivf_nprobe: [1, 4, 16, 64, 256]

evaluation:
  ndcg_k: 10
  recall_k: 100
  mrr_k: 10

tracking:
  experiment: knowledgeqa
